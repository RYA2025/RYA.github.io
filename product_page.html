<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Product Page</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            font-size: 24px;
        }

        /* Product Display */
        .product {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .product-image {
            flex: 1;
            max-width: 400px;
        }
        .product-image img {
            width: 100%;
            border-radius: 10px;
        }
        .product-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Selection & Inputs */
        .variants {
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        /* Price & Add to Cart */
        .product-price {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
        }
        .add-to-cart {
            width: 100%;
            padding: 12px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .add-to-cart:hover {
            background-color: #0056b3;
        }

        /* Cart Notification */
        .notification {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: #28a745;
            color: white;
            padding: 12px 20px;
            border-radius: 5px;
            display: none;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .product {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Revolutionary Youth Apparel</h1>
    <div class="product">
        <!-- Product Image -->
        <div class="product-image">
            <img src="https://via.placeholder.com/400" alt="Product Image">
        </div>

        <!-- Product Details -->
        <div class="product-details">
            <p class="product-price">$20.00</p>

            <!-- Sleeve Selection -->
            <div class="variants">
                <label for="sleeve">Sleeve:</label>
                <select id="sleeve" onchange="updatePrice()">
                    <option value="short">Short Sleeve ($20.00)</option>
                    <option value="long">Long Sleeve ($23.00)</option>
                </select>
